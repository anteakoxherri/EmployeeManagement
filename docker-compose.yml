name: employee-management

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  ConnectionStrings__DefaultConnection: 'Server=sqlserver,1433;Database=${SQL_DATABASE:-EmployeeManagementDb};User Id=sa;Password="${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}";Encrypt=True;TrustServerCertificate=True'
  Jwt__Key: ${JWT_KEY:?Set JWT_KEY to at least 32 UTF-8 bytes}
  Jwt__Issuer: ${JWT_ISSUER:-EmployeeManagementAPI}
  Jwt__Audience: ${JWT_AUDIENCE:-EmployeeManagementClient}
  SeedAdmin__Email: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL}
  SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD}
  RabbitMq__Enabled: "true"
  RabbitMq__ConsumerEnabled: "true"
  RabbitMq__HostName: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__UserName: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$${MSSQL_SA_PASSWORD}\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    extends:
      file: docker-compose.rabbitmq.yml
      service: rabbitmq
    restart: unless-stopped

  # I njejti imazh si API; puna perfundon pasi aplikon migrations ekzistuese.
  migrate:
    image: employee-management-api:local
    pull_policy: never
    entrypoint: ["/app/efbundle"]
    environment: *api-environment
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    image: employee-management-api:local
    build:
      context: .
      dockerfile: EmployeeManagement.Server/Dockerfile
      target: final
    environment: *api-environment
    volumes:
      - profile_pictures:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # Endpoint-i i mbrojtur duhet te ktheje 401 pa token kur API eshte gati.
      test: ["CMD-SHELL", "[ \"$$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://localhost:8080/api/tasks)\" = '401' ]"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./EmployeeManagement.Client
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver_data:
  rabbitmq_data:
  profile_pictures:
