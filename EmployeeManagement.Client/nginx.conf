# Docker DNS rifreskon adresat kur API rikrijohet ose shtohen replika.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream employee_api {
    zone employee_api 64k;
    server api:8080 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Kufiri i API-se eshte 2 MB; lejojme edhe overhead-in e multipart form.
    client_max_body_size 3m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api {
        proxy_pass http://employee_api;
    }

    location /uploads/profile-pictures/ {
        proxy_pass http://employee_api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
